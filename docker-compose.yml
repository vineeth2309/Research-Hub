# Research Hub with Docker Compose. Works as it is:
#
#   docker compose up -d            build and start; restarts by itself after a crash or a reboot
#   docker compose logs hub         the one-time link for creating the admin account (first start only)
#   docker compose build && docker compose up -d     after pulling a new version
#
# To change anything, copy .env.example to .env and edit it; this file does not need to be touched.
services:
  hub:
    build: .
    image: research-hub:local
    restart: unless-stopped
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-6230}:6230"
    volumes:
      - "${HUB_DATA:-hub-data}:/data"
    environment:
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-http://localhost:6230}"
      HUB_TRUST_PROXY: "${HUB_TRUST_PROXY:-}"
      # first start only: create the admin account (and a first project) without opening the setup link
      HUB_ADMIN_EMAIL: "${HUB_ADMIN_EMAIL:-}"
      HUB_ADMIN_PASSWORD: "${HUB_ADMIN_PASSWORD:-}"
      HUB_ADMIN_NAME: "${HUB_ADMIN_NAME:-}"
      HUB_FIRST_PROJECT: "${HUB_FIRST_PROJECT:-}"
volumes:
  hub-data:
